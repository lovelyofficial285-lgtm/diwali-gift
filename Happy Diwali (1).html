<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#120a2a;--bg2:#2a0f3d;--gold:#ffc857;--glow:#ff9a1f;--text:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(#0b0620,var(--bg1) 40%,var(--bg2));color:var(--text);font-family:Poppins,system-ui,sans-serif;overflow:hidden;position:relative}
#warm{position:fixed;inset:0;background:radial-gradient(circle at 50% 70%,rgba(255,154,31,.55),rgba(255,90,20,.15) 55%,transparent 75%);opacity:0;transition:opacity 2s}
body.lit #warm{opacity:1}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:1.25rem;color:var(--gold);z-index:3;transition:opacity .4s}
#stage{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .6s}
body.lit .flame{transform:scale(1);animation:flick .15s infinite alternate .6s}
@keyframes flick{to{transform:scale(1.06,.94) rotate(2deg)}}
.win{fill:#2b2350;transition:fill 1.5s}
body.lit .win{fill:#ffc857}
.petal{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.draw .petal{animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#lantern.go{animation:burst .9s forwards}
@keyframes burst{40%{transform:scale(1.4)}100%{transform:scale(3);opacity:0}}
#lantern{transform-box:fill-box;transform-origin:center}
#fin{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,5,25,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 1.2s}
#fin.show{opacity:1;pointer-events:auto}
#fin small{letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:.8rem}
#nm{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(2.6rem,13vw,5.5rem);line-height:1.1;background:linear-gradient(#fff2b0,#ffb020 60%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,150,30,.6));transform:scale(.7);transition:transform 1.4s cubic-bezier(.2,1.4,.4,1)}
#fin.show #nm{transform:scale(1)}
#fin p{opacity:.85;max-width:300px}
#mk{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#mk input{padding:11px 14px;border-radius:999px;border:1px solid #ffc85766;background:#ffffff14;color:var(--text);font:inherit;width:190px;outline:none}
#mk button,#re{padding:11px 18px;border-radius:999px;border:0;background:linear-gradient(#ffc857,#ff9a1f);color:#3a1500;font:500 1rem Poppins,sans-serif;cursor:pointer}
#re{background:none;color:var(--gold);border:1px solid #ffc85766;margin-top:4px}
.sp{position:fixed;width:7px;height:7px;border-radius:50%;z-index:4;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
</style>
</head>
<body>
<div id="warm"></div>
<div id="hint">Tap the diya</div>

<svg id="stage" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="fg"><stop offset="0" stop-color="#fff6c0"/><stop offset="1" stop-color="#ff7a00"/></radialGradient></defs>
  <!-- house -->
  <polygon points="40,260 200,175 360,260" fill="#1d1540"/>
  <rect x="60" y="260" width="280" height="200" fill="#241a4d"/>
  <rect class="win" x="90" y="295" width="52" height="52" rx="4"/>
  <rect class="win" x="258" y="295" width="52" height="52" rx="4"/>
  <rect class="win" x="175" y="370" width="50" height="90" rx="25 25 0 0"/>
  <rect x="0" y="460" width="400" height="140" fill="#160e33"/>
  <!-- string lights -->
  <path d="M40 260 Q120 300 200 262 T360 260" stroke="#ffffff22" fill="none"/>
  <!-- rangoli -->
  <g transform="translate(200 530) scale(1.15 .42)"><g id="rangoli" class="tap"></g></g>
  <!-- diyas -->
  <g id="diya" class="tap"></g>
  <!-- lantern -->
  <g id="lanternWrap" class="tap">
    <line x1="200" y1="0" x2="200" y2="78" stroke="#ffc857" stroke-width="2"/>
    <g id="lantern">
      <rect x="184" y="76" width="32" height="10" rx="3" fill="#ffc857"/>
      <rect x="170" y="86" width="60" height="78" rx="22" fill="#d62d20"/>
      <rect x="170" y="86" width="60" height="78" rx="22" fill="none" stroke="#ffc857" stroke-width="3"/>
      <path d="M185 88v74M200 86v78M215 88v74" stroke="#ffc85777" stroke-width="2" fill="none"/>
      <rect x="184" y="164" width="32" height="9" rx="3" fill="#ffc857"/>
      <path d="M200 173v22" stroke="#ffc857" stroke-width="3"/>
    </g>
  </g>
</svg>

<div id="fin">
  <small>Happy Diwali</small>
  <div id="nm"></div>
  <p>May your life glow with light, love and endless joy.</p>
  <div id="mk"><input id="in" placeholder="Type a name" maxlength="24"><button id="cp">Copy link</button></div>
  <button id="re">Replay</button>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg', step=0;
  var $=function(i){return document.getElementById(i)};
  // name from #hash
  function getName(){
    var h=''; try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
    h=h.replace(/-/g,' ').trim();
    return h||'Friend';
  }
  // diyas
  var d=$('diya');
  [[78,500],[322,500]].forEach(function(p){
    var x=p[0],y=p[1];
    d.insertAdjacentHTML('beforeend',
      '<g transform="translate('+x+' '+y+')">'+
      '<ellipse cx="0" cy="30" rx="30" ry="6" fill="#00000055"/>'+
      '<path d="M-30 6 Q0 44 30 6 Q0 14 -30 6Z" fill="#c9561a" stroke="#ffc857" stroke-width="2"/>'+
      '<g class="flame"><path d="M0 4 C-12 -8 -6 -22 0 -34 C6 -22 12 -8 0 4Z" fill="url(#fg)"/></g></g>');
  });
  // rangoli
  var cols=['#ff4d6d','#ffc857','#ff9a1f','#7bd88f','#5ec8ff','#d98cff'],r=$('rangoli'),h='';
  for(var i=0;i<12;i++){
    h+='<path class="petal" pathLength="1" stroke="'+cols[i%6]+'" style="animation-delay:'+(i*.08)+'s" transform="rotate('+i*30+')" d="M0 0C26 -30 26 -66 0 -92C-26 -66 -26 -30 0 0Z"/>';
  }
  [28,58,100].forEach(function(rad,j){
    h+='<circle class="petal" pathLength="1" r="'+rad+'" stroke="'+cols[(j*2+1)%6]+'" style="animation-delay:'+(.9+j*.2)+'s"/>';
  });
  for(i=0;i<12;i++){
    var a=i*30*Math.PI/180;
    h+='<circle class="petal" pathLength="1" r="5" cx="'+Math.cos(a)*76+'" cy="'+Math.sin(a)*76+'" stroke="'+cols[i%6]+'" style="animation-delay:'+(1.2+i*.05)+'s"/>';
  }
  r.innerHTML='<circle r="108" fill="#ffc857" fill-opacity=".14" stroke="#ffc857" stroke-opacity=".7" stroke-width="3" stroke-dasharray="7 7"/><circle r="62" fill="none" stroke="#ffc857" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6"/>'+h;
  // hint pulse
  function setHint(t,id){
    $('hint').textContent=t;
    ['diya','rangoli','lanternWrap'].forEach(function(k){$(k).classList.toggle('pulse',k===id)});
  }
  function spark(n){
    var c=['#ffc857','#ff9a1f','#ff4d6d','#fff2b0'];
    for(var i=0;i<n;i++){
      var s=document.createElement('div'),a=Math.random()*6.28,dist=80+Math.random()*220;
      s.className='sp';
      s.style.cssText='left:50%;top:22%;background:'+c[i%4]+';--dx:'+Math.cos(a)*dist+'px;--dy:'+Math.sin(a)*dist+'px';
      document.body.appendChild(s);
      setTimeout(function(e){e.remove()},1700,s);
    }
  }
  $('diya').addEventListener('click',function(){
    if(step!==0)return; step=1;
    document.body.classList.add('lit');
    setTimeout(function(){setHint('Now tap the rangoli','rangoli')},900);
    setHint('','');
  });
  $('rangoli').addEventListener('click',function(){
    if(step!==1)return; step=2;
    r.classList.add('draw');
    setHint('Drawing...','');
    setTimeout(function(){setHint('Finally, tap the lantern','lanternWrap')},2400);
  });
  $('lanternWrap').addEventListener('click',function(){
    if(step!==2)return; step=3;
    $('lantern').classList.add('go');
    $('hint').style.opacity=0;
    spark(40);
    $('nm').textContent=getName();
    setTimeout(function(){$('fin').classList.add('show');spark(30)},700);
  });
  $('re').addEventListener('click',function(){
    $('fin').classList.remove('show');
    document.body.classList.remove('lit');
    r.classList.remove('draw');
    $('lantern').classList.remove('go');
    $('hint').style.opacity=1;
    step=0; setHint('Tap the diya','diya');
  });
  $('cp').addEventListener('click',function(){
    var n=$('in').value.trim().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,'-');
    if(!n)return;
    var url=location.href.split('#')[0]+'#'+n;
    try{navigator.clipboard.writeText(url);$('cp').textContent='Copied!'}catch(e){$('cp').textContent='Copy failed'}
    location.hash=n; $('nm').textContent=getName();
    setTimeout(function(){$('cp').textContent='Copy link'},1800);
  });
  window.addEventListener('hashchange',function(){$('nm').textContent=getName()});
  setHint('Tap the diya','diya');
})();
</script>
</body>
</html>
